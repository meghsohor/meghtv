name: Sync channels with iptv-org

# Scheduled workflows only run from the default branch, so this lives on main and works on the channels branch.
on:
  schedule:
    - cron: "0 6 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:

concurrency:
  group: sync-iptv
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      # GitHub turns off schedules in a public repo after 60 days without activity; re-enabling resets that.
      - name: Keep the schedule on
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/sync-iptv.yml/enable"

      - uses: actions/checkout@v7
        with:
          ref: channels

      - name: Fetch iptv-org
        run: |
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/iptv-org/iptv.git "$RUNNER_TEMP/iptv"
          git -C "$RUNNER_TEMP/iptv" sparse-checkout set streams
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/iptv-org/database.git "$RUNNER_TEMP/database"
          git -C "$RUNNER_TEMP/database" sparse-checkout set data

      - name: Merge into the channel list
        run: python3 scripts/sync_iptv.py --iptv "$RUNNER_TEMP/iptv" --database "$RUNNER_TEMP/database" --summary "$RUNNER_TEMP/summary.md"

      - name: Check
        run: |
          python3 -m unittest discover -s scripts
          python3 scripts/build_channels.py --check

      - name: Push to the channels branch
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No changes from iptv-org" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit --quiet -m "Sync with iptv-org on $(date -u +%Y-%m-%d)"
          git push --quiet origin HEAD:channels

  # A push made with GITHUB_TOKEN starts no workflows, so "Publish channels" won't run for it; this job does the same.
  # It runs every day, so a failed publish is retried; the build skips the deploy when the live list is current.
  publish:
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: publish-channels
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: channels

      - name: Build the list
        id: build
        run: python3 scripts/build_channels.py --out site --live https://meghsohor.github.io/meghtv

      - name: Upload
        if: steps.build.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy
        id: deploy
        if: steps.build.outputs.changed == 'true'
        uses: actions/deploy-pages@v5
