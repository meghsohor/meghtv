name: Release APK

# Every merge to main; check-version skips the release unless versionName increased.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Compare versionName against the latest release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

          # No fallback: an API error must fail the run, not read as "no releases yet" and rebuild one.
          LATEST_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName')
          LATEST="${LATEST_TAG#v}"

          if [[ -z "$LATEST" ]]; then
            echo "No existing release found — will build $CURRENT."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$CURRENT" == "$LATEST" ]]; then
            echo "versionName ($CURRENT) unchanged since last release ($LATEST) — skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            HIGHEST=$(printf '%s\n%s\n' "$CURRENT" "$LATEST" | sort -V | tail -1)
            if [[ "$HIGHEST" == "$CURRENT" ]]; then
              echo "versionName increased ($LATEST -> $CURRENT) — will build."
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "versionName ($CURRENT) is not newer than latest release ($LATEST) — skipping."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  build-and-release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # The signing secrets live in this environment, which only main can deploy to.
    environment: release
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools build-tools;34.0.0"

      # No daemons left running, so no build plugin is still alive while the key is on disk.
      - name: Build unsigned release APK
        run: ./gradlew --no-daemon -Pkotlin.compiler.execution.strategy=in-process assembleRelease

      # Signed with the SDK's own tools, so no third-party action sees the key.
      - name: Sign release APK
        id: apk
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          ALIGNED="$RUNNER_TEMP/aligned.apk"
          DEST="MeghTV-v$VERSION.apk"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          "$BUILD_TOOLS/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --v4-signing-enabled false --out "$DEST" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$DEST" | grep -E "DN|SHA-256"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: ${{ steps.apk.outputs.path }}
