name: Check channels

on:
  pull_request:
    branches: [channels]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test the scripts
        run: python3 -m unittest discover -s scripts

      - name: Check the data
        run: python3 scripts/build_channels.py --check
